                            ios: !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/), //ios终端
                            android: u.indexOf('Android') > -1 || u.indexOf('Linux') > -1, //android终端或uc浏览器
                            iPhone: u.indexOf('iPhone') > -1, //是否为iPhone或者QQHD浏览器
                            iPad: u.indexOf('iPad') > -1, //是否iPad

        function sendSoj(action, customparam, type, site, plat, page, ep) {

            //如果是pad

            if (!type) {

                var b = document.body;
                b.appendChild(s);
            }
        }

        function pad(source) {
            return ('00' + source).match(/\d{2}$/)[0];
        }

        var getScreen = function () {

                        root[nsParts[i]] = {};

        var guid = null;
        apf.Utils = {

            // http://techpatterns.com/downloads/javascript_cookies.php
            setCookie: function (name, value, expires, path, domain, secure) {
                // set time, it's in milliseconds
                var today = new Date();
                today.setTime(today.getTime());
                /*
                 if the expires variable is set, make the correct
                 expires time, the current script below will set
                 it for x number of days, to make it for hours,
                 delete * 24, for minutes, delete * 60 * 24
                 */
                if (expires) {
                    expires = expires * 1000 * 60 * 60 * 24;
                }
                var expires_date = new Date(today.getTime() + (expires));

                doc.cookie = name + "=" + escape(value) +
                    ((expires) ? ";expires=" + expires_date.toGMTString() : "") +
                    ((path) ? ";path=" + path : "") +
                    ((domain) ? ";domain=" + domain : "") +
                    ((secure) ? ";secure" : "");
            },

            // this fixes an issue with the old method, ambiguous values
            // with this test document.cookie.indexOf( name + "=" );
            getCookie: function (check_name) {
                // first we'll split this cookie up into name/value pairs
                // note: document.cookie only returns name=value, not the other components
                var a_all_cookies = doc.cookie.split(';'),
                    a_temp_cookie = '',
                    cookie_name = '',
                    cookie_value = '',
                    length,
                    b_cookie_found = false; // set boolean t/f default f

                for (i = 0, length = a_all_cookies.length; i < length; i++) {
                    // now we'll split apart each name=value pair
                    a_temp_cookie = a_all_cookies[i].split('=');
                    // and trim left/right whitespace while we're at it
                    cookie_name = a_temp_cookie[0].replace(/^\s+|\s+$/g, '');

                    // if the extracted name matches passed check_name
                    if (cookie_name == check_name) {
                        b_cookie_found = true;
                        // we need to handle case where cookie has no value but exists (no = sign, that is):
                        if (a_temp_cookie.length > 1) {
                            cookie_value = decodeURIComponent(a_temp_cookie[1].replace(/^\s+|\s+$/g, ''));
                        }
                        // note that in cases where cookie is initialized but no value, null is returned
                        return cookie_value;
                        break;
                    }
                    a_temp_cookie = null;
                    cookie_name = '';
                }
                if (!b_cookie_found) {
                    return null;
                }
            },

            // this deletes the cookie when called
            deleteCookie: function (name, path, domain) {
                if (this.getCookie(name)) {
                    doc.cookie = name + "=" +
                        ((path) ? ";path=" + path : "") +
                        ((domain) ? ";domain=" + domain : "") + ";expires=Thu, 01-Jan-1970 00:00:01 GMT";
                }
            },
            touchClick: function () {
                var status = true;
                $(doc).on('touchmove', function () {
                    if (status) {
                        doc.addEventListener('click', preventDefault, true);
                        status = false;
                    }
                });

                $(doc).on('touchend', function () {
                    doc.removeEventListener('click', preventDefault, true);
                    status = true;
                });
            },
            checkPhone: function (val) {
                var telpattern = /^1\d{10}$/;
                if (telpattern.test(val)) {
                    return true;
                }
                return false;
            },
            trackEvent: function (action, customparam, type, ep) {
                var cp = customparam;
                if ($.isPlainObject(customparam)) {
                    cp = JSON.stringify(customparam);
                }
                sendSoj(action, cp, type || 2, '', '', '', ep);

            },
            /**
             * [getGuid 在统计电话时长的时候为了保持唯一关联性，防止用户间隔时间长或者清除cookie后两个soj无法关联起来]
             * @param  {[String]} sType
             * @return {[String]}
             */
            _getGuid: function () {
                var date = new Date(),
                    month = date.getMonth() + 1,
                    date2 = date.getDate(),
                    hours = date.getHours(),
                    minutes = date.getMinutes(),
                    d = date.getTime();
                var uuid = ('xxxxxxxx-yxxx-yxxx-yxxx-Txxx').replace(/[xy]/g, function (c) {
                    var r = (d + Math.random() * 16) % 16 | 0;
                    d = Math.floor(d / 0x3);
                    return (c == 'x' ? r : (r & 0x7 | 0x8)).toString(16);
                });
                return (uuid + pad(month) + pad(date2) + pad(hours) + pad(minutes)).toUpperCase();
            },
            getOs: function () {
                var u = navigator.userAgent;
                return { //移动终端浏览器版本信息
                    ios: !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/), //ios终端
                    android: u.indexOf('Android') > -1 || u.indexOf('Linux') > -1, //android终端或uc浏览器
                    iPhone: u.indexOf('iPhone') > -1, //是否为iPhone或者QQHD浏览器
                    iPad: u.indexOf('iPad') > -1, //是否iPad
                    isWx: u.indexOf('MicroMessenger') > -1, //是微信游览器
                };
            },
            getGuid: function (status) {
                if (status === 1) {
                    guid = this._getGuid();
                    return guid;
                }
                if (!guid) {
                    guid = this._getGuid();
                }
                return guid;
            },
            log: function (params) {
                return log(params);
            },
            getCookieGuid: function () {
                return this.getCookie('aQQ_ajkguid');
            },
            addLinkSoj: function (selector, attr, param) {

                if (+$body.data('track-npv') !== 1) {

            },
            replaceImg: function (v, attrName, watermark) {
                attrName = attrName ? attrName : 'data-src';
                watermark = watermark === false ? false : true;
                if (!v) return false;
                var s = v.getAttribute(attrName);
                if (s != "" && s != null) {
                    var re = s.split('/').pop().match(/\d+x\d+/g);
                    if (re) {
                        var w = parseInt(v.clientWidth),
                            h = parseInt(v.clientHeight),
                            ratio = 0,
                            suffix = '';
                        if (window.devicePixelRatio && window.devicePixelRatio != 1) {
                            w = parseInt(w * window.devicePixelRatio);
                            h = parseInt(h * window.devicePixelRatio);
                        }
                        if (!watermark) {
                            if (w > 220 || h > 220) { //宽或高大于220px将设置水印
                                var wRatio = w / 220,
                                    hRatio = h / 220,
                                    ratio = wRatio > hRatio ? wRatio : hRatio;
                                ratio = Math.ceil(ratio);
                                w = Math.floor(w / ratio);
                                h = Math.floor(h / ratio);
                            }
                            if (ratio !== 0) {
                                s = s.replace(/(\.\w+)$/g, '@' + ratio + 'x$1');
                            }
                        }
                        size = w + 'x' + h;
                        if (w && h) {
                            s = s.replace(re, w + 'x' + h);
                        }
                    }
                    var pic = new Image();
                    pic.src = s;

                    pic.onerror = function (e) {
                        v.setAttribute(attrName, '');
                        return false;
                    }
                    pic.onload = function () {
                        v.setAttribute('src', s);
                        // v.setAttribute(attrName, '');
                    }
                }
            },
            LocalStorageHelper: function (action, key, val) {
                try {
                    if (action == "setItem") {
                        localStorage[action](key, val);
                        return true;
                    } else {
                        var result = localStorage[action](key);
                        return result;
                    }
                } catch (e) {
                    return false;
                }
            },
            //替代原生scroll事件
            scrollHelper: function (selector) {
                var record = {};
                $('body').on("touchstart", selector, function (e) {
                    record.startTop = e.targetTouches[0].screenY; // 触摸开始时触摸点的位置
                    record.startScrollTop = $(this).scrollTop();  // 触摸开始时内div的scrollTop
                });
                $('body').on("touchmove", selector, function (e) {
                    e.preventDefault();
                    var curY = e.targetTouches[0].screenY;
                    $(this).scrollTop(record.startScrollTop + record.startTop - curY); // js控制滚动
                });
            },
            sendSoj: sendSoj
        };
        (function () { // 初始化发送soj
            var pageName,

        win.APF = apf;

        $(function () {

        // 协议拦截

        window.locations = {}
        Object.defineProperty(locations, 'href', {
            set: function (val) {

            }
        })

        $("body").on("click", "a", function (e) {
            var target = e.currentTarget
            if (target.href && !/javascript/.test(target.href)) {
                e.preventDefault();
                e.stopPropagation();
                clickCB(target.href, driver, $(this))
                return
            }
        })
        function clickCB(url, driver, self) {
            RULE.lastIndex = 0
            if (RULE.test(url) && INMUXING) {
                driver.jump(url)
            } else {
                // 登录方式变更
                if (url.indexOf('thirdPartyLogInAndRegister') > 0) {
                    location.href = 'openanjuke://app.anjuke.com/m/common/login_entry?wxentry_activity_launch_by_self=true';
                    return;
                }
                var soj = self && self.data('soj'),
                    _soj = $.trim(soj), // 去空格
                    _param = 'from'; // 默认是from

                if (!_soj) { // 如果无soj,直接跳转
                    location.href = url;
                    return false;
                }

                if (url.indexOf('?') !== -1) {
                    location.href = url + '&' + _param + '=' + _soj;
                } else {
                    location.href = url + '?' + _param + '=' + _soj;
                }
            }
            return false
        }
    })(window, document, Zepto);
